ml:
  n_trials: 50
  timeout_seconds: 3600
  n_splits: 3
  search_sample_fraction: 0.5
  pruner: median
  sampler: tpe
  search_space:
    n_estimators: {low: 100, high: 300}
    max_depth: {low: 3, high: 8}
    learning_rate: {low: 0.01, high: 0.3, log: true}
    subsample: {low: 0.6, high: 1.0}
    colsample_bytree: {low: 0.6, high: 1.0}
    min_child_weight: {low: 1, high: 10}
    reg_lambda: {low: 0.001, high: 10.0, log: true}
    reg_alpha: {low: 0.001, high: 10.0, log: true}
